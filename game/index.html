<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0713; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { z-index: 0; touch-action: none; }
  #hud { z-index: 1; pointer-events: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Neon Harbor: an open world crime game on the coast of a neon city"></canvas>
<canvas id="hud"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
